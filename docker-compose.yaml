services:
  db:
    image: cleisonfmelo/postgres-pg-cron:latest
    container_name: ytdle_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ytdle_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/backend/internal/database/migrations/001_setup.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ytdle_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.2
    container_name: redis-server
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
volumes:
  pgdata:
  redis_data:
